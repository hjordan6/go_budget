services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jack
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: budget
      PGUSER: postgres
      PGPASSWORD: jack
      PGSSLMODE: disable
      APP_PORT: "8891"
    ports:
      - "8891:8891"
    restart: unless-stopped

volumes:
  pgdata:
